name: CI

on:
  push:
    branches: [main, 'release/**']
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Read version
        shell: bash
        run: |
          VERSION=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props)
          test -n "$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build
        run: dotnet build LocalCorrect.sln -c Release --verbosity minimal

      # The runner's 1024 x 768 screen is too small for the settings window at 150 %.
      - name: Set the screen size for the window screenshots
        run: Set-DisplayResolution -Width 1920 -Height 1080 -Force

      - name: Test
        env:
          LOCALCORRECT_SCREENSHOT_DIR: ${{ github.workspace }}/screenshots
        run: dotnet test LocalCorrect.sln -c Release --no-build --verbosity minimal

      - name: Upload the window screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: screenshots/*.png
          if-no-files-found: error

      - name: Publish self-contained tray app
        run: dotnet publish src/LocalCorrect.App/LocalCorrect.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o publish

      - name: Cache LanguageTool and JDK downloads
        uses: actions/cache@v4
        with:
          path: |
            build/cache/LanguageTool-6.6.zip
            build/cache/temurin-17.0.21_9-windows-x64.zip
          key: bundle-lt-53600506-temurin-98518ecf

      - name: Bundle LanguageTool and Java, smoke test
        shell: bash
        run: build/bundle-languagetool.sh publish --smoke

      - name: LanguageTool integration test (real server through the app's engine)
        shell: bash
        env:
          LOCALCORRECT_BUNDLE_DIR: ${{ github.workspace }}/publish
        run: dotnet test LocalCorrect.sln -c Release --no-build --filter "FullyQualifiedName~BundleIntegrationTests" --logger "console;verbosity=detailed"

      - name: Package zip
        shell: bash
        run: |
          dotnet_root=$(dirname "$(command -v dotnet)")
          cp "$dotnet_root/LICENSE.txt" publish/licenses/dotnet-LICENSE.txt
          cp "$dotnet_root/ThirdPartyNotices.txt" publish/licenses/dotnet-ThirdPartyNotices.txt
          cp installer/install.cmd installer/uninstall.cmd publish/
          mkdir -p dist
          (cd publish && 7z a -tzip -mx=7 "../dist/LocalCorrect-$VERSION-win-x64.zip" * > /dev/null)
          7z l "dist/LocalCorrect-$VERSION-win-x64.zip" | tail -n 3
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: LocalCorrect-${{ env.VERSION }}-win-x64
          path: dist/LocalCorrect-${{ env.VERSION }}-win-x64.zip
          if-no-files-found: error
          compression-level: 0
