name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build LocalCorrect.sln -c Release --verbosity minimal

      - name: Test
        run: dotnet test LocalCorrect.sln -c Release --no-build --verbosity minimal

      - name: Publish self-contained tray app
        run: dotnet publish src/LocalCorrect.App/LocalCorrect.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o publish

      - name: Package zip
        shell: pwsh
        run: |
          Copy-Item installer/install.cmd publish/install.cmd
          Copy-Item installer/uninstall.cmd publish/uninstall.cmd
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path publish/* -DestinationPath dist/LocalCorrect-0.1.0-alpha.1-win-x64.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: LocalCorrect-0.1.0-alpha.1-win-x64
          path: dist/LocalCorrect-0.1.0-alpha.1-win-x64.zip
          if-no-files-found: error
